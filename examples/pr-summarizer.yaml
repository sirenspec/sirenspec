version: "0.1"

# PR Summarizer — fetches a GitHub pull-request diff via the GitHub API and
# then asks an LLM to write a concise summary of the changes.
#
# Graph structure:
#
#   [fetch_diff] ---> [summarize]
#
# Prerequisites
# -------------
# Set GITHUB_TOKEN in your environment (a classic PAT with repo:read scope).
# Set the GITHUB_API_URL to the specific pull request diff endpoint.
#
# Example:
#   export GITHUB_TOKEN=ghp_...
#   sirenspec run examples/pr-summarizer.yaml \
#     --input "Summarise this pull request for me."
#
# Note: Template placeholders ({{ env.GITHUB_TOKEN }}) are resolved by the
# executor before the HTTP request is made.  The diff text is then available
# to the downstream summarize node via the workflow context.

agents:
  summarizer:
    model: "openai:gpt-4o-mini"
    system: |
      You are a senior software engineer reviewing a GitHub pull request.
      You will be given the raw unified diff of the pull request.
      Write a concise, developer-friendly summary that covers:
        1. What changed (the "what")
        2. Why the change is likely being made (the "why"), inferred from the diff
        3. Any notable risks, edge cases, or things reviewers should pay attention to

      Keep the summary under 200 words. Use markdown with bullet points where helpful.

nodes:
  fetch_diff:
    type: tool
    tool: http
    config:
      # Replace the URL with the actual GitHub API diff endpoint for your PR.
      # Format: https://api.github.com/repos/{owner}/{repo}/pulls/{number}
      url: "https://api.github.com/repos/TJLSmith0831/sirenspec/pulls/1"
      method: GET
      headers:
        Authorization: "Bearer {{ env.GITHUB_TOKEN }}"
        Accept: "application/vnd.github.v3.diff"
        User-Agent: "sirenspec/0.1"
      timeout: 15
    output_key: diff

  summarize:
    agent: summarizer
    writes: output.summary

edges:
  - from: fetch_diff
    to: summarize

guardrails:
  - injection
