version: "0.1"

# Squad Builder — factory node example
#
# 1. The planner agent decomposes a goal into a JSON list of subtasks.
# 2. The factory node spawns one worker agent per subtask (up to 4 in parallel).
# 3. The summarizer agent aggregates all worker outputs into a final report.
#
# Run with:
#   sirenspec run examples/squad-builder.yaml --input "Build a guide on sustainable architecture"

agents:
  planner:
    model: "openai:gpt-4o-mini"
    system: |
      You are a project planner. Given a goal, output a JSON array of concrete task strings.
      Respond with ONLY a valid JSON array, nothing else. Example:
      ["Research the topic", "Draft an outline", "Write section 1", "Write section 2"]

  worker:
    model: "openai:gpt-4o-mini"
    system: |
      You are a focused worker. Complete the following task concisely (2-3 sentences).

  summarizer:
    model: "anthropic:claude-haiku-4-5-20251001"
    system: |
      You are a technical writer. Synthesize the following completed task outputs into
      a single coherent, well-structured report.

nodes:
  plan:
    agent: planner
    writes: working.plan.output

  execute:
    type: factory
    agent: worker
    for_each: "{{ plan.output }}"
    inputs:
      task: "{{ item }}"
      context: "{{ inputs.message }}"
    concurrency: 4
    timeout_per_instance: 60
    on_failure: continue
    writes: working.execute.outputs

  aggregate:
    agent: summarizer
    writes: output.report

edges:
  - from: plan
    to: execute
  - from: execute
    to: aggregate

guardrails:
  - injection

input:
  message: "Build a comprehensive guide on sustainable architecture."
