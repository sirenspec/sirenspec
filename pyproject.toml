[project]
name = "sirenspec"
version = "0.1.0"
description = "YAML-first agent orchestration SDK for multi-agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "TJLSmith0831", email = "tjlsmith0831@gmail.com" }]
keywords = ["agents", "llm", "yaml", "orchestration", "multi-agent", "openai", "anthropic", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.101.0",
    "jsonschema>=4.0.0",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.25.1",
]

[project.urls]
Homepage = "https://github.com/TJLSmith0831/sirenspec"
Repository = "https://github.com/TJLSmith0831/sirenspec"
Issues = "https://github.com/TJLSmith0831/sirenspec/issues"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.152.7",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.12",
]

[project.scripts]
sirenspec = "sirenspec.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sirenspec.core.data" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
