[project]
name = "sirenspec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.101.0",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.152.7",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
rule-select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
rule-ignore = [
    "E501",  # line too long (handled by formatter)
]
